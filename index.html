<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="3D 跑酷小遊戲：奶蛙騎腳踏車在田埂上逃命，吃奶蛋、閃障礙，別被牛來抓到。">
<style>*,*::before,*::after{box-sizing:border-box}</style>
<title>奶蛙騎腳踏車</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Lilita+One&display=swap">
<style>
/* 單一視覺：田野黃昏 + 貼紙感 UI。刻意只做一種配色 */
:root{
  --milk:#F4B92E; --milk-deep:#D9951A; --olive:#3B4224; --cream:#FBF0CF;
  --paddy:#7DA83A; --dusk:#E8744A; --danger:#D9412E; --ink:#2A2918;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Lilita One","Arial Black",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#2E2A3A;color:var(--ink);font-family:var(--f-display)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.hud[hidden]{display:none!important}
.stat{display:flex;flex-direction:column;gap:6px}
.score{font-family:var(--f-num);font-size:clamp(30px,6vw,46px);line-height:1;color:var(--cream);
  -webkit-text-stroke:2px var(--olive);paint-order:stroke fill;text-shadow:0 3px 0 var(--olive);font-variant-numeric:tabular-nums}
.coins{display:inline-flex;align-items:center;gap:8px;background:var(--cream);border:3px solid var(--olive);border-radius:999px;
  padding:3px 12px 3px 6px;font-family:var(--f-num);font-size:22px;color:var(--olive);box-shadow:0 3px 0 var(--olive);width:max-content}
.egg{width:20px;height:24px;background:var(--milk);border:2px solid var(--olive);border-radius:50% 50% 50% 50%/58% 58% 42% 42%;position:relative}
.egg::before,.egg::after{content:"";position:absolute;top:8px;width:6px;height:6px;border-radius:50%;background:#5FAE3A;box-shadow:inset 0 0 0 2px #5FAE3A,inset 0 0 0 4px #111}
.egg::before{left:1px}.egg::after{right:1px}
.btns{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:44px;height:44px;border-radius:12px;border:3px solid var(--olive);background:var(--cream);color:var(--olive);
  font:900 18px var(--f-display);box-shadow:0 3px 0 var(--olive);cursor:pointer}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--olive)}
.icon-btn:focus-visible,.go:focus-visible{outline:3px solid var(--dusk);outline-offset:3px}
.warn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) rotate(-2deg);
  background:var(--danger);color:var(--cream);font-weight:900;font-size:18px;letter-spacing:.06em;padding:6px 16px;border:3px solid var(--olive);
  border-radius:10px;box-shadow:0 3px 0 var(--olive);animation:pulse .5s ease-in-out infinite alternate;pointer-events:none;white-space:nowrap}
@keyframes pulse{to{transform:translateX(-50%) rotate(2deg) scale(1.06)}}
.screen{position:fixed;inset:0;display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(46,42,58,0) 30%,rgba(46,42,58,.55))}
.card{width:min(420px,100%);background:var(--cream);border:4px solid var(--olive);border-radius:22px;box-shadow:0 8px 0 var(--olive);
  padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;transform:rotate(-1.2deg)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--dusk)}
h1{margin:0;font-weight:900;font-size:clamp(38px,10vw,54px);line-height:1.02;color:var(--milk);text-wrap:balance;
  -webkit-text-stroke:3px var(--olive);paint-order:stroke fill;text-shadow:0 4px 0 var(--olive)}
.sub{margin:0;font-size:16px;font-weight:700;color:var(--olive)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px;color:var(--olive)}
.keys dt{font-weight:900;font-family:var(--f-num);letter-spacing:.04em}
.keys dd{margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.best{font-size:14px;font-weight:700;color:var(--olive)}
.best b{font-family:var(--f-num);font-size:20px;font-weight:400}
.go{appearance:none;border:4px solid var(--olive);background:var(--milk);color:var(--olive);font:900 22px var(--f-display);
  letter-spacing:.12em;padding:10px 26px;border-radius:14px;box-shadow:0 5px 0 var(--olive);cursor:pointer}
.go:hover{background:#FFC93F}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--olive)}
.big{display:flex;gap:18px;flex-wrap:wrap}
.big div{display:flex;flex-direction:column}
.big span{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--dusk)}
.big b{font-family:var(--f-num);font-weight:400;font-size:36px;color:var(--olive);font-variant-numeric:tabular-nums}
.new{background:var(--danger);color:var(--cream);font-weight:900;font-size:13px;padding:3px 10px;border-radius:999px;align-self:flex-start}
.loading{font-size:13px;color:var(--olive);opacity:.8}
#overScreen{place-items:end center}
@media (prefers-reduced-motion:reduce){.warn{animation:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="遊戲畫面"></canvas>

<div class="hud" id="hud" hidden>
  <div class="stat">
    <div class="score" id="score">0</div>
    <div class="coins"><i class="egg" aria-hidden="true"></i><span id="coins">0</span></div>
  </div>
  <div class="btns">
    <button class="icon-btn" id="pauseBtn" aria-label="暫停">II</button>
    <button class="icon-btn" id="muteBtn" aria-label="靜音">♪</button>
  </div>
</div>
<div class="warn" id="warn" hidden>牛來追上來了！</div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="kicker">田埂大逃亡</div>
    <h1>奶蛙騎腳踏車</h1>
    <p class="sub">牛來在後面追，一路吃奶蛋、閃稻草捆，千萬別被抓到。</p>
    <dl class="keys">
      <dt>← → / A D</dt><dd>換車道</dd>
      <dt>↑ / W / 空白</dt><dd>跳起來</dd>
      <dt>↓ / S</dt><dd>趴低鑽過曬衣竿</dd>
      <dt>手機</dt><dd>上下左右滑動</dd>
    </dl>
    <div class="row">
      <div class="best">最高分 <b id="bestStart">0</b></div>
      <button class="go" id="startBtn">出發</button>
    </div>
    <div class="loading" id="loading">撞到東西會晃一下，短時間內再撞一次就會被牛來抓走。</div>
  </div>
</div>

<div class="screen" id="pauseScreen" hidden>
  <div class="card">
    <h1>休息一下</h1>
    <div class="row"><span class="sub">牛來也停下來喘氣了。</span><button class="go" id="resumeBtn">繼續</button></div>
  </div>
</div>

<div class="screen" id="overScreen" hidden>
  <div class="card">
    <div class="kicker" id="overKicker">GAME OVER</div>
    <h1 id="overTitle">被牛來抓到了</h1>
    <span class="new" id="newBest" hidden>新紀錄</span>
    <div class="big">
      <div><span>分數</span><b id="finalScore">0</b></div>
      <div><span>奶蛋</span><b id="finalCoins">0</b></div>
      <div><span>最高分</span><b id="finalBest">0</b></div>
    </div>
    <div class="row"><span class="sub">Enter 或空白鍵也能重來</span><button class="go" id="againBtn">再騎一次</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

let actx=null, master=null, buffers={}, voice=null, muted=false;
try { muted = localStorage.getItem('naiwa-muted')==='1'; } catch(e){}
function b64ToBuf(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u.buffer; }
function initAudio(){
  if(actx) { if(actx.state==='suspended') actx.resume(); return; }
  const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
  actx = new AC(); master = actx.createGain(); master.gain.value = muted?0:1; master.connect(actx.destination);
  for(const k in AUDIO_SRC){
    try{ actx.decodeAudioData(b64ToBuf(AUDIO_SRC[k]), b=>{buffers[k]=b;}, ()=>{}); }catch(e){}
  }
}
function playVoice(key){
  if(!actx||!buffers[key]) return;
  if(voice){ try{voice.stop();}catch(e){} voice=null; }
  const s=actx.createBufferSource(); s.buffer=buffers[key]; s.connect(master); s.start(); voice=s;
  s.onended=()=>{ if(voice===s) voice=null; };
}
function playMoveSound(){ playVoice(Math.random()<0.5?'a1':'a3'); }
function playHitSound(){ playVoice('a2'); }
function blip(){
  if(!actx) return; const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle';
  o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(1500,t+0.07);
  g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.13);
}
function setMuted(m){ muted=m; if(master) master.gain.value=m?0:1; $('muteBtn').textContent=m?'×':'♪'; $('muteBtn').setAttribute('aria-label',m?'開啟聲音':'靜音'); try{localStorage.setItem('naiwa-muted',m?'1':'0');}catch(e){} }

}

  else { u.armL.piv.rotation.x=-s*1.0; u.armR.piv.rotation.x=s*1.0; u.armL.piv.rotation.z=0.12; u.armR.piv.rotation.z=-0.12; }
  u.body.position.y=Math.abs(Math.cos(u.phase))*0.16; u.body.rotation.x=-0.12;
}

function addCoin(x,y,z){ const m=makeEggMesh(1.05); m.position.set(x,y,z); m.rotation.y=Math.PI; scene.add(m); coins.push({x,y,z,mesh:m,taken:false,t:0}); }
function spawnRow(z){
  const dist=-z;
  const lanes=[0,1,2].sort(()=>Math.random()-0.5);
  const n=dist<120?1:(Math.random()<0.55?2:1);
  const used=new Set(); const lowLanes=[];
  for(let i=0;i<n;i++){
    const L=lanes[i]; const r=Math.random(); let type= r<0.3?'hay':r<0.5?'fence':r<0.72?'line':'truck';
    let moving=false;
    if(type==='truck' && dist>350 && Math.random()<0.35){ const recent=rowsHist.slice(-2).some(h=>h.has(L)); if(!recent) moving=true; }
    addObstacle(type,L,z,moving); used.add(L); if(TYPES[type].low) lowLanes.push(L);
  }
  const free=[0,1,2].filter(l=>!used.has(l));
  const r=Math.random();
  if(lowLanes.length && r<0.35){ const L=lowLanes[0]; for(let i=-3;i<=3;i++){ const dz=i*1.4; addCoin(LANES[L],0.9+1.4*(1-(i/3.4)**2),z+dz); } used.add(L); }
  else if(free.length && r<0.85){ const L=free[Math.random()*free.length|0]; for(let i=0;i<6;i++) addCoin(LANES[L],0.9,z+2+i*1.6); used.add(L); }
  rowsHist.push(used); if(rowsHist.length>4) rowsHist.shift();
}

// ---------- game state ----------

  clearWorld(); Object.assign(S,{z:0,x:0,y:0,vy:0,lane:1,prevLane:1,speed:14,t:0,coins:0,score:0,duck:0,grounded:true,chaseTimer:2.6,chaseDist:2.4,wobble:0,nextRow:-45,deadT:0,lean:0});

function endGame(){
  S.state='over'; ui.hud.hidden=true; ui.warn.hidden=true;
  const sc=Math.floor(S.score); const isNew=sc>best; if(isNew){ best=sc; try{localStorage.setItem('naiwa-best',String(best));}catch(e){} }
  ui.finalScore.textContent=sc; ui.finalCoins.textContent=S.coins; ui.finalBest.textContent=best; ui.newBest.hidden=!isNew; ui.bestStart.textContent=best;

function crash(reason){ if(S.state!=='play') return; S.state='dying'; S.deadT=0; S.deadReason=reason; playHitSound(); ui.warn.hidden=true;
  for(const c of coins) scene.remove(c.mesh); coins=[]; }
function stumble(){
  playHitSound(); S.wobble=0.6;

  S.chaseTimer=7;
}
function setPaused(p){ if(S.state!=='play') return; S.paused=p; ui.pause.hidden=!p; if(!p) canvas.focus(); }

// ---------- input ----------
function act(a){
  if(S.state!=='play'||S.paused) return;
  if(a==='left'||a==='right'){ const nl=S.lane+(a==='left'?-1:1); if(nl<0||nl>2) return; S.prevLane=S.lane; S.lane=nl; playMoveSound(); }
  else if(a==='up'){ if(S.grounded){ S.vy=10.5; S.grounded=false; S.duck=0; playMoveSound(); } }
  else if(a==='down'){ if(!S.grounded) S.vy=-20; S.duck=0.75; playMoveSound(); }
}
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(S.state==='title'&&(k==='Enter'||k===' ')){ e.preventDefault(); startGame(); return; }
  if(S.state==='over'&&(k==='Enter'||k===' ')){ e.preventDefault(); startGame(); return; }
  if(k==='Escape'||k==='p'||k==='P'){ setPaused(!S.paused); return; }
  if(e.repeat) return;
  const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',' ':'up',ArrowDown:'down',s:'down',S:'down'};
  if(map[k]){ e.preventDefault(); act(map[k]); }
});
let touch=null;
canvas.addEventListener('pointerdown',e=>{ touch={x:e.clientX,y:e.clientY,done:false}; });
canvas.addEventListener('pointermove',e=>{ if(!touch||touch.done) return; const dx=e.clientX-touch.x, dy=e.clientY-touch.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>28){ touch.done=true; if(Math.abs(dx)>Math.abs(dy)) act(dx<0?'left':'right'); else act(dy<0?'up':'down'); } });

// ---------- update ----------
function playerTop(){ return S.duck>0?1.8:2.6; }
function update(dt){
  const u=player.userData;
  if(S.state==='play'){
    S.t+=dt; S.speed=Math.min(32,14+S.t*0.22);
    const prevZ=S.z, prevX=S.x, prevY=S.y;
    S.z-=S.speed*dt; S.score+=S.speed*dt*0.5;
    const tx=LANES[S.lane]; const nx=S.x+(tx-S.x)*Math.min(1,dt*13); S.lean=(nx-S.x)/Math.max(dt,1e-4)*-0.03; S.x=nx;
    // ground (can ride on top of low obstacles)
    let ground=0;
    for(const o of obstacles){ if(!o.low) continue; if(Math.abs(S.x-o.x)<1.1 && Math.abs(S.z-o.z)<o.hl+0.8 && prevY>=o.y1-0.3) ground=Math.max(ground,o.y1); }
    S.vy-=30*dt; S.y+=S.vy*dt;
    if(S.y<=ground){ if(!S.grounded && S.vy<-3){ u.rider.scale.y=0.82*0.85; } S.y=ground; S.vy=0; S.grounded=true; } else if(S.y>ground+0.05) S.grounded=false;
    if(S.duck>0) S.duck-=dt;
    if(S.chaseTimer>0) S.chaseTimer-=dt;
    if(S.wobble>0) S.wobble-=dt;
    // moving trucks
    for(const o of obstacles){ if(o.moving && o.z-S.z>-70){ o.z+=7*dt; o.mesh.position.z=o.z; } }
    // collisions
    const top=playerTop();
    for(const o of obstacles){
      const xo=Math.abs(S.x-o.x)<1.1, zo=Math.abs(S.z-o.z)<o.hl+0.85;
      if(!xo||!zo) continue;
      if(o.low && S.y>=o.y1-0.3) continue;
      const yo=S.y<o.y1 && S.y+top>o.y0; if(!yo) continue;
      const prevXo=Math.abs(prevX-o.x)<1.1;
      if(!prevXo){ S.lane=S.prevLane; S.x=prevX; stumble(); break; }
      else { crash('crash'); break; }
    }
    // coins
    for(const c of coins){ if(c.taken) continue;
      if(Math.abs(c.z-S.z)<1.0 && Math.abs(c.x-S.x)<0.9 && c.y>S.y-0.4 && c.y<S.y+top+0.2){ c.taken=true; S.coins++; S.score+=5; blip(); } }
    // spawn / cleanup
    while(S.nextRow>S.z-175){ spawnRow(S.nextRow); S.nextRow-=rnd(15,24)+S.speed*0.25; }
    obstacles=obstacles.filter(o=>{ if(o.z>S.z+18){ scene.remove(o.mesh); return false; } return true; });
    coins=coins.filter(c=>{ if(c.z>S.z+12||(c.taken&&c.t>0.35)){ scene.remove(c.mesh); return false; } return true; });
    ui.score.textContent=Math.floor(S.score); ui.coins.textContent=S.coins; ui.warn.hidden=!(S.chaseTimer>0 && S.t>3);
  } else if(S.state==='dying'){
    S.deadT+=dt; S.speed=Math.max(0,S.speed-dt*40); S.z-=S.speed*dt*0.3;
    S.y=Math.max(0,S.y-dt*4);
    u.bike.rotation.z=Math.max(-1.25,u.bike.rotation.z-dt*2.5); u.bike.position.y=Math.max(-0.1,u.bike.position.y);
    if(S.deadT>2.2) endGame();
  }
  // chaser
  const near=S.state==='title'?3.2:(S.state==='dying'||S.state==='over')?1.6:(S.chaseTimer>0?2.6:17);
  S.chaseDist+= (near-S.chaseDist)*Math.min(1,dt*(S.state==='dying'?2.5:1.6));
  const side = S.state==='title'?1.6:(S.state==='dying'?0.9:(S.lane===2?-1.3:1.3));
  chaser.position.set(chaser.position.x+((S.x+side)-chaser.position.x)*Math.min(1,dt*5),0,S.z+S.chaseDist);
  chaser.rotation.y = S.state==='dying'? Math.atan2(-(S.x-chaser.position.x),-(S.z-chaser.position.z))*0.6 : 0;
  animChaser(chaser,dt,S.speed, S.state==='title'?'idle':((S.state==='dying'&&S.deadT>0.7)||S.state==='over'?'grab':'run'));
  // player visuals
  player.position.set(S.x,S.y,S.z);
  const moving=S.state==='play'?S.speed:(S.state==='dying'?S.speed*0.3:0);
  for(const w of u.wheels) w.rotation.x-=moving*dt/0.47;
  u.crankA+=moving*dt/0.47*0.55;
  if(S.state==='play'){
    const wob=S.wobble>0?Math.sin(S.wobble*30)*0.18*S.wobble:0;
    u.bike.rotation.z += ((S.lean*0.9+wob)-u.bike.rotation.z)*Math.min(1,dt*12);
    u.bike.rotation.x += ((S.grounded?0:Math.max(-0.25,Math.min(0.25,S.vy*0.025)))-u.bike.rotation.x)*Math.min(1,dt*10);
  }
  const ducking=S.duck>0;
  const ts=0.82, tsy=ducking?0.82*0.7:0.82;
  u.rider.scale.x+=(ts-u.rider.scale.x)*Math.min(1,dt*14); u.rider.scale.z=u.rider.scale.x;
  u.rider.scale.y+=(tsy-u.rider.scale.y)*Math.min(1,dt*14);
  u.rider.rotation.x+=((ducking?-0.35:(S.state==='title'?0:-0.08))-u.rider.rotation.x)*Math.min(1,dt*12);
  u.rider.position.y=u.riderBase.y+(S.state==='play'?Math.abs(Math.sin(u.crankA*2))*0.025:0);
  poseRider(player);
  // coins spin / pop
  const now=performance.now()/1000;
  for(const c of coins){ if(c.taken){ c.t+=dt; c.mesh.position.y=c.y+c.t*5; c.mesh.scale.setScalar(1.05*(1+c.t*2)); c.mesh.position.x=S.x+(c.x-S.x)*(1-c.t*2); }
    else { c.mesh.rotation.y=Math.PI+Math.sin(now*3+c.z)*0.9; c.mesh.position.y=c.y+Math.sin(now*4+c.z)*0.08; } }
  // tiles recycle
  for(const t of tiles){ if(t.position.z>S.z+TILE*1.5){ t.position.z-=NT*TILE; buildProps(t); } }
  far.position.z=S.z;
  // light follows
  sun.position.set(S.x-8,16,S.z+10); sun.target.position.set(S.x,0,S.z-4);
  // camera
  let cp, cl;
  if(S.state==='title'){
    const a=now*0.25; cp=_a.set(S.x+Math.sin(a)*1.2+2.6,2.2,S.z-6.2); cl=_b.set(S.x+0.6,1.5,S.z+1.8);
  } else if(S.state==='over' || (S.state==='dying' && S.deadT>0.4)){
    cp=_a.set(S.x-5.6,2.6,S.z-1.6); cl=_b.set(S.x+0.3,-0.4,S.z+0.9);
  } else {
    cp=_a.set(S.x*0.6,5.0+S.y*0.35,S.z+8.2); cl=_b.set(S.x*0.35,1.4+S.y*0.25,S.z-9);
  }
  const k=Math.min(1,dt*(S.state==='play'?8:2.5));
  cam.pos.lerp(cp,k); cam.look.lerp(cl,k);
  camera.position.copy(cam.pos); camera.lookAt(cam.look);
}

// ---------- loop ----------
function resize(){ const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w/h<0.8?75:62; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
const clock=new THREE.Clock();
// title-pose: frog parked, 牛來 standing behind
chaser.position.set(1.6,0,3); S.chaseDist=3.2;
cam.pos.set(2.6,2.2,-6.2); cam.look.set(0.6,1.5,1.8);
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);
  if(!S.paused) update(dt);
  renderer.render(scene,camera);
}
frame();
})();
</script>
</body>
