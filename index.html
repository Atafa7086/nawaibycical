<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="3D 跑酷小遊戲：奶蛙騎腳踏車在田埂上逃命，吃奶蛋、撿道具，別被牛來抓到。">
<title>奶蛙騎腳踏車</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Lilita+One&display=swap">
<style>
/* 單一視覺：田野晝夜 + 貼紙感 UI，刻意只做一種配色 */
:root{
  --milk:#F4B92E; --olive:#3B4224; --cream:#FBF0CF; --dusk:#E8744A; --danger:#D9412E; --ink:#2A2918; --leaf:#5E9A35;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Lilita One","Arial Black",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#1E2238;color:var(--ink);font-family:var(--f-display);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(20,10,30,.38) 100%)}
.flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .25s}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.stat{display:flex;flex-direction:column;gap:6px;min-width:0}
.score{font-family:var(--f-num);font-size:clamp(30px,6vw,46px);line-height:1;color:var(--cream);
  -webkit-text-stroke:2px var(--olive);paint-order:stroke fill;text-shadow:0 3px 0 var(--olive);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--cream);border:3px solid var(--olive);border-radius:999px;
  padding:2px 10px 2px 5px;font-family:var(--f-num);font-size:20px;color:var(--olive);box-shadow:0 3px 0 var(--olive);width:max-content}
.pill.mult{padding:2px 10px;background:var(--milk)}
.egg{width:18px;height:22px;background:var(--milk);border:2px solid var(--olive);border-radius:50% 50% 50% 50%/58% 58% 42% 42%;position:relative;flex:none}
.egg::before,.egg::after{content:"";position:absolute;top:7px;width:6px;height:6px;border-radius:50%;background:#111;box-shadow:0 0 0 1.5px #5FAE3A}
.egg::before{left:1px}.egg::after{right:1px}
.powers{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.pw{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;background:rgba(251,240,207,.92);border:2px solid var(--olive);border-radius:10px;padding:3px 8px 3px 4px;width:170px;font-weight:900;font-size:13px;color:var(--olive)}
.pw i{width:22px;height:22px;border-radius:7px;border:2px solid var(--olive);display:block}
.pw .bar{grid-column:2;height:5px;border-radius:3px;background:rgba(59,66,36,.18);overflow:hidden}
.pw .bar b{display:block;height:100%;background:var(--olive);transform-origin:left}
.pw.ending{animation:blink .3s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.btns{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:44px;height:44px;border-radius:12px;border:3px solid var(--olive);background:var(--cream);color:var(--olive);
  font:900 18px var(--f-display);box-shadow:0 3px 0 var(--olive);cursor:pointer;display:grid;place-items:center}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--olive)}
button:focus-visible{outline:3px solid var(--dusk);outline-offset:3px}
.toast{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(26px,6vw,42px);color:var(--cream);
  -webkit-text-stroke:3px var(--olive);paint-order:stroke fill;text-shadow:0 4px 0 var(--olive);pointer-events:none;white-space:nowrap;opacity:0}
.toast.show{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.warn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) rotate(-2deg);
  background:var(--danger);color:var(--cream);font-weight:900;font-size:18px;letter-spacing:.06em;padding:6px 16px;border:3px solid var(--olive);
  border-radius:10px;box-shadow:0 3px 0 var(--olive);animation:pulse .5s ease-in-out infinite alternate;pointer-events:none;white-space:nowrap}
@keyframes pulse{to{transform:translateX(-50%) rotate(2deg) scale(1.06)}}
.tod{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
.screen{position:fixed;inset:0;display:grid;place-items:center;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(30,34,56,0) 25%,rgba(30,34,56,.6))}
#startScreen{place-items:center end}
#overScreen{place-items:end center}
.card{width:min(440px,100%);background:var(--cream);border:4px solid var(--olive);border-radius:22px;box-shadow:0 8px 0 var(--olive);
  padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px;transform:rotate(-1deg)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--dusk)}
h1{margin:0;font-weight:900;font-size:clamp(36px,9vw,52px);line-height:1.02;color:var(--milk);text-wrap:balance;
  -webkit-text-stroke:3px var(--olive);paint-order:stroke fill;text-shadow:0 4px 0 var(--olive)}
.sub{margin:0;font-size:15px;font-weight:700;color:var(--olive)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13.5px;color:var(--olive)}
.keys dt{font-weight:900;font-family:var(--f-num);letter-spacing:.04em}
.keys dd{margin:0}
.items{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--olive)}
.items li{display:flex;gap:7px;align-items:flex-start;line-height:1.3}
.items i{flex:none;width:16px;height:16px;border-radius:5px;border:2px solid var(--olive);margin-top:1px}
.items b{font-weight:900}
.sect{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--dusk);margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{appearance:none;border:2px solid var(--olive);background:transparent;color:var(--olive);font:700 13px var(--f-display);padding:5px 10px;border-radius:999px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--olive);color:var(--cream)}
.best{font-size:14px;font-weight:700;color:var(--olive)}
.best b{font-family:var(--f-num);font-size:20px;font-weight:400}
.go{appearance:none;border:4px solid var(--olive);background:var(--milk);color:var(--olive);font:900 22px var(--f-display);
  letter-spacing:.12em;padding:10px 26px;border-radius:14px;box-shadow:0 5px 0 var(--olive);cursor:pointer}
.go:hover{background:#FFC93F}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--olive)}
.big{display:flex;gap:18px;flex-wrap:wrap}
.big div{display:flex;flex-direction:column}
.big span{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--dusk)}
.big b{font-family:var(--f-num);font-weight:400;font-size:34px;color:var(--olive);font-variant-numeric:tabular-nums}
.new{background:var(--danger);color:var(--cream);font-weight:900;font-size:13px;padding:3px 10px;border-radius:999px;align-self:flex-start}
.c-rocket{background:#E2483B}.c-magnet{background:#B8323A}.c-spring{background:#62C25B}.c-double{background:#F4B92E}.c-shield{background:#3E86D8}
@media (max-width:700px){#startScreen{place-items:end center}.card{padding:16px}.items{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.warn,.pw.ending{animation:none}.toast.show{animation-duration:.01s;opacity:1}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="遊戲畫面"></canvas>
<div class="vignette"></div>
<div class="flash" id="flash"></div>

<div class="hud" id="hud" hidden>
  <div class="stat">
    <div class="score" id="score">0</div>
    <div class="chips">
      <div class="pill"><i class="egg" aria-hidden="true"></i><span id="coins">0</span></div>
      <div class="pill mult" id="mult">x1</div>
    </div>
    <div class="powers" id="powers"></div>
  </div>
  <div class="btns">
    <button class="icon-btn" id="pauseBtn" aria-label="暫停">II</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="warn" id="warn" hidden>牛來追上來了！</div>
<div class="tod" id="tod" hidden></div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="kicker">田埂大逃亡</div>
    <h1>奶蛙騎腳踏車</h1>
    <p class="sub">牛來在後面追。一路吃奶蛋、撿道具、閃稻草捆，從午後騎到深夜。</p>
    <dl class="keys">
      <dt>← → / A D</dt><dd>換車道</dd>
      <dt>↑ / W / 空白</dt><dd>跳起來</dd>
      <dt>↓ / S</dt><dd>趴低鑽過曬衣竿</dd>
      <dt>手機</dt><dd>上下左右滑動</dd>
    </dl>
    <div class="sect">道具</div>
    <ul class="items">
      <li><i class="c-rocket"></i><span><b>沖天飛車</b> 飛上天收奶蛋，障礙全無視</span></li>
      <li><i class="c-magnet"></i><span><b>超強磁鐵</b> 附近的奶蛋自己飛過來</span></li>
      <li><i class="c-spring"></i><span><b>彈簧輪</b> 超高跳，能跳上發財車</span></li>
      <li><i class="c-double"></i><span><b>雙倍奶蛋</b> 奶蛋一顆算兩顆</span></li>
      <li><i class="c-shield"></i><span><b>鐵頭盔</b> 擋下一次撞擊</span></li>
    </ul>
    <div class="row">
      <div class="toggles" role="group" aria-label="設定">
        <button class="tg" id="tgMusic" aria-pressed="true">音樂</button>
        <button class="tg" id="tgSfx" aria-pressed="true">音效</button>
        <button class="tg" id="tgHQ" aria-pressed="true">高畫質</button>
      </div>
    </div>
    <div class="row">
      <div class="best">最高分 <b id="bestStart">0</b></div>
      <button class="go" id="startBtn">出發</button>
    </div>
  </div>
</div>

<div class="screen" id="pauseScreen" hidden>
  <div class="card">
    <h1>休息一下</h1>
    <div class="toggles" role="group" aria-label="設定">
      <button class="tg" id="tgMusic2" aria-pressed="true">音樂</button>
      <button class="tg" id="tgSfx2" aria-pressed="true">音效</button>
      <button class="tg" id="tgHQ2" aria-pressed="true">高畫質</button>
    </div>
    <div class="row"><span class="sub">牛來也停下來喘氣了。</span><button class="go" id="resumeBtn">繼續</button></div>
  </div>
</div>

<div class="screen" id="overScreen" hidden>
  <div class="card">
    <div class="kicker">GAME OVER</div>
    <h1 id="overTitle">被牛來抓到了</h1>
    <span class="new" id="newBest" hidden>新紀錄</span>
    <div class="big">
      <div><span>分數</span><b id="finalScore">0</b></div>
      <div><span>奶蛋</span><b id="finalCoins">0</b></div>
      <div><span>距離</span><b id="finalDist">0</b></div>
      <div><span>最高分</span><b id="finalBest">0</b></div>
    </div>
    <div class="row"><span class="sub">Enter 或空白鍵也能重來</span><button class="go" id="againBtn">再騎一次</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

let actx=null, sfxGain, musicGain, buffers={}, voice=null, voicePrio=0, noiseBuf=null;
function b64ToBuf(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function initAudio(){
  if(actx){ if(actx.state==='suspended') actx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  actx=new AC();
  const comp=actx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(actx.destination);
  sfxGain=actx.createGain(); sfxGain.gain.value=cfg.sfx?1:0; sfxGain.connect(comp);
  musicGain=actx.createGain(); musicGain.gain.value=cfg.music?0.3:0; musicGain.connect(comp);
  for(const k in AUDIO_SRC){ try{ actx.decodeAudioData(b64ToBuf(AUDIO_SRC[k]),b=>buffers[k]=b,()=>{}); }catch(e){} }
  noiseBuf=actx.createBuffer(1,actx.sampleRate*0.3,actx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  Music.start();
}
function playVoice(key,prio){
  if(!actx||!buffers[key]) return;
  if(voice && prio<voicePrio) return;           // 低優先不打斷高優先（撞擊 > 道具 > 移動）
  if(voice){ try{voice.stop();}catch(e){} }
  const s=actx.createBufferSource(); s.buffer=buffers[key]; s.connect(sfxGain); s.start(); voice=s; voicePrio=prio;
  s.onended=()=>{ if(voice===s){ voice=null; voicePrio=0; } };
}
const sndMove=()=>playVoice('a1',1), sndItem=()=>playVoice('a3',2), sndHit=()=>playVoice('a2',3);
const PENTA=[1,9/8,5/4,3/2,5/3,2,9/4,5/2,3,10/3];
function sndCoin(chain){
  if(!actx) return; const t=actx.currentTime, f=987.8*PENTA[Math.min(chain,PENTA.length-1)];
  for(const [m,v,d] of [[1,0.09,0.18],[2.01,0.035,0.1],[3,0.015,0.06]]){
    const o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=f*m;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.004); g.gain.exponentialRampToValueAtTime(0.0005,t+d);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+d+0.02); }
}
function sndPop(){ if(!actx) return; const t=actx.currentTime; const o=actx.createOscillator(),g=actx.createGain(); o.type='sine';
  o.frequency.setValueAtTime(600,t); o.frequency.exponentialRampToValueAtTime(220,t+0.15); g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.2); }
function sndWhoosh(){ if(!actx) return; const t=actx.currentTime; const s=actx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2; bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(2400,t+0.8);

    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.35,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+d+0.02); }
  function shaker(t,v){ const s=actx.createBufferSource(); s.buffer=noiseBuf; const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;

  function schedule(){
    while(next<actx.currentTime+0.25){
      const bar=Math.floor(step/8)%8, e=step%8, sect=SECT[Math.floor(step/64)%SECT.length];
      const t=next+(e%2?E*0.12:0); // 輕微搖擺
      const ch=CH[bar];
      if(e===0||e===4) kick(t);
      shaker(t,e%2?0.012:0.022);
      if(e===0||e===4) bass(t,mtof(BASS[bar]),E*3.4);
      if(e===3||e===7) bass(t,mtof(BASS[bar]+(e===7?7:12)),E*0.9);
      if([0,3,4,6].includes(e)) ch.forEach((n,i)=>pluck(t+i*0.018,mtof(n),0.5,e===0?0.07:0.045));
      if(sect!=='C'){ for(const ev of events[bar]) if(ev.at===e){ const f=mtof(ev.n);

class Particles{
  constructor(max,blending){ this.max=max; this.n=0; const g=new THREE.BufferGeometry();
    this.pos=new Float32Array(max*3); this.col=new Float32Array(max*4); this.size=new Float32Array(max);
    this.vel=new Float32Array(max*3); this.life=new Float32Array(max); this.maxLife=new Float32Array(max); this.base=new Float32Array(max*4); this.s0=new Float32Array(max); this.grav=new Float32Array(max);
    g.setAttribute('position',new THREE.BufferAttribute(this.pos,3)); g.setAttribute('pcol',new THREE.BufferAttribute(this.col,4)); g.setAttribute('psize',new THREE.BufferAttribute(this.size,1));
    this.mat=new THREE.ShaderMaterial({uniforms:{map:{value:dotTex},scale:{value:300}},transparent:true,depthWrite:false,blending:blending||THREE.NormalBlending,
      vertexShader:`attribute vec4 pcol; attribute float psize; uniform float scale; varying vec4 vC; void main(){ vC=pcol; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=psize*scale/-mv.z; gl_Position=projectionMatrix*mv; }`,
      fragmentShader:`uniform sampler2D map; varying vec4 vC; void main(){ vec4 t=texture2D(map,gl_PointCoord); gl_FragColor=vec4(vC.rgb,vC.a*t.a); if(gl_FragColor.a<0.01) discard; }`});
    this.pts=new THREE.Points(g,this.mat); this.pts.frustumCulled=false; scene.add(this.pts); this.geo=g; }
  emit(x,y,z,vx,vy,vz,life,size,c,a,grav){ let i=this.n<this.max?this.n++:(Math.random()*this.max|0);
    this.pos.set([x,y,z],i*3); this.vel.set([vx,vy,vz],i*3); this.life[i]=this.maxLife[i]=life; this.s0[i]=size; this.base.set([c.r,c.g,c.b,a],i*4); this.grav[i]=grav||0; }
  update(dt){ for(let i=0;i<this.n;i++){ this.life[i]-=dt; if(this.life[i]<=0){ const l=--this.n;
        if(i!==l){ for(const [arr,k] of [[this.pos,3],[this.vel,3],[this.base,4]]) for(let j=0;j<k;j++) arr[i*k+j]=arr[l*k+j];
          this.life[i]=this.life[l]; this.maxLife[i]=this.maxLife[l]; this.s0[i]=this.s0[l]; this.grav[i]=this.grav[l]; } i--; continue; }
      this.vel[i*3+1]-=this.grav[i]*dt; for(let j=0;j<3;j++) this.pos[i*3+j]+=this.vel[i*3+j]*dt;
      const t=this.life[i]/this.maxLife[i]; this.size[i]=this.s0[i]*(0.4+0.6*t); for(let j=0;j<3;j++) this.col[i*4+j]=this.base[i*4+j]; this.col[i*4+3]=this.base[i*4+3]*Math.min(1,t*2); }

}

  if(S.state!=='play'||S.paused) return;
  if(a==='left'||a==='right'){ const nl=S.lane+(a==='left'?-1:1); if(nl<0||nl>2) return; S.prevLane=S.lane; S.lane=nl; sndMove(); }
  else if(a==='up'){ if(S.power.rocket>0) return; if(S.grounded){ S.vy=S.power.spring>0?16.5:10.5; S.grounded=false; S.duck=0; sndMove();
      if(S.power.spring>0) burst(S.x,S.y+0.2,S.z,col('#9CFF7A'),18,0.6); } }
  else if(a==='down'){ if(S.power.rocket>0) return; if(!S.grounded) S.vy=-24; S.duck=0.75; sndMove(); }
}
window.addEventListener('keydown',e=>{
  const k=e.key;
  if((S.state==='title'||S.state==='over')&&(k==='Enter'||k===' ')){ e.preventDefault(); startGame(); return; }
  if(k==='Escape'||k==='p'||k==='P'){ setPaused(!S.paused); return; }
  if(e.repeat) return;
  const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',' ':'up',ArrowDown:'down',s:'down',S:'down'};
  if(map[k]){ e.preventDefault(); act(map[k]); }
});
let touch=null;
canvas.addEventListener('pointerdown',e=>{ touch={x:e.clientX,y:e.clientY,done:false}; });
canvas.addEventListener('pointermove',e=>{ if(!touch||touch.done) return; const dx=e.clientX-touch.x,dy=e.clientY-touch.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>26){ touch.done=true; if(Math.abs(dx)>Math.abs(dy)) act(dx<0?'left':'right'); else act(dy<0?'up':'down'); } });
canvas.addEventListener('pointerup',()=>{ touch=null; });
$('startBtn').addEventListener('click',startGame); $('againBtn').addEventListener('click',startGame);
$('pauseBtn').addEventListener('click',()=>setPaused(true)); $('resumeBtn').addEventListener('click',()=>setPaused(false));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) setPaused(true); });
function syncToggles(){ for(const [id,k] of [['tgMusic','music'],['tgSfx','sfx'],['tgHQ','hq'],['tgMusic2','music'],['tgSfx2','sfx'],['tgHQ2','hq']]) $(id).setAttribute('aria-pressed',cfg[k]?'true':'false'); }
for(const [id,k] of [['tgMusic','music'],['tgSfx','sfx'],['tgHQ','hq'],['tgMusic2','music'],['tgSfx2','sfx'],['tgHQ2','hq']])
  $(id).addEventListener('click',()=>{ cfg[k]=!cfg[k]; store.set('naiwa-'+k,cfg[k]?'1':'0'); syncToggles(); applyAudioCfg(); if(k==='hq') applyQuality(); });
syncToggles();
function applyQuality(){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,cfg.hq?2:1));
  sun.shadow.mapSize.set(cfg.hq?2048:1024,cfg.hq?2048:1024); if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; }
  for(const s of furShells) s.visible=cfg.hq;
  for(const t of tiles) for(const f of t.userData.fields) f.rice.count=cfg.hq?f.rice.userData.full:Math.floor(f.rice.userData.full*0.45);
  resize();
}

/* =========================================================
   UPDATE
   ========================================================= */
let envTimer=0, lastEnvTod=-1, powerEls={};
function playerTop(){ return S.duck>0?1.8:2.6; }
function updatePowersUI(){
  for(const k in ITEMS){ const v=S.power[k]; let el=powerEls[k];
    if(v>0){ if(!el){ el=document.createElement('div'); el.className='pw'; el.innerHTML=`<i class="c-${k}"></i><span>${ITEMS[k].name}</span><div class="bar"><b></b></div>`; ui.powers.appendChild(el); powerEls[k]=el; }
      el.querySelector('b').style.transform=`scaleX(${clamp(v/ITEMS[k].dur,0,1)})`; el.classList.toggle('ending',v<2 && k!=='shield'); }
    else if(el){ el.remove(); delete powerEls[k]; } }
}
function update(dt,now){
  const u=player.userData, P=S.power;
  if(S.state==='play'){
    S.t+=dt; S.speed=15+21*(1-Math.exp(-S.t/100));
    const prevX=S.x,prevY=S.y;
    const v=S.speed*(P.rocket>0?1.25:1); S.z-=v*dt; S.dist+=v*dt;
    const mult=1+Math.min(4,Math.floor(S.dist/700)); S.score+=v*dt*0.5*mult;
    const tx=LANES[S.lane], nx=S.x+(tx-S.x)*Math.min(1,dt*13); S.lean=(nx-S.x)/Math.max(dt,1e-4)*-0.03; S.x=nx;
    for(const k in P){ if(P[k]>0){ P[k]-=dt; if(P[k]<=0){ P[k]=0; if(k==='rocket'){ S.invuln=1.6; S.vy=0; S.grounded=false; for(const o of obstacles) if(o.z<S.z&&o.z>S.z-40){ knock(o); } } sndPop(); } } }
    if(S.invuln>0) S.invuln-=dt;
    let ground=0;
    if(P.rocket>0){ S.y+=(8.6-S.y)*Math.min(1,dt*3); S.vy=0; S.grounded=false; }
    else {
      for(const o of obstacles){ if(!o.plat||o.knock) continue; if(Math.abs(S.x-o.x)<1.1&&Math.abs(S.z-o.z)<o.hl+0.8&&prevY>=o.y1-0.3) ground=Math.max(ground,o.y1); }
      S.vy-=(S.vy>0?30:38)*dt; S.y+=S.vy*dt;
      if(S.y<=ground){ if(!S.grounded&&S.vy<-6){ for(let i=0;i<12;i++) dust.emit(S.x+rnd(-0.5,0.5),ground+0.1,S.z+rnd(-0.8,0.8),rnd(-2,2),rnd(0.5,1.5),rnd(-1,1),rnd(0.4,0.7),rnd(0.5,0.9),C_DUST,0.5,1); }
        S.y=ground; S.vy=0; S.grounded=true; } else if(S.y>ground+0.05) S.grounded=false;
    }
    if(S.duck>0) S.duck-=dt; if(S.chaseTimer>0) S.chaseTimer-=dt; if(S.wobble>0) S.wobble-=dt;
    for(const o of obstacles){ if(o.moving&&!o.knock&&o.z-S.z>-75){ o.z+=7*dt; o.mesh.position.z=o.z; } }
    // 碰撞
    if(P.rocket<=0 && S.invuln<=0){ const top=playerTop();
      for(const o of obstacles){ if(o.knock) continue;
        const xo=Math.abs(S.x-o.x)<1.1, zo=Math.abs(S.z-o.z)<o.hl+0.85; if(!xo||!zo) continue;
        if(o.plat&&S.y>=o.y1-0.3) continue;
        if(!(S.y<o.y1&&S.y+top>o.y0)) continue;
        if(Math.abs(prevX-o.x)>=1.1){ S.lane=S.prevLane; S.x=prevX; hitObstacle(o,true); } else hitObstacle(o,false);
        break; } }
    // 奶蛋
    const top=playerTop();
    for(const c of coins){ if(c.taken) continue;
      if(P.magnet>0 && !c.mag && c.z<S.z+3 && c.z>S.z-14 && Math.abs(c.y-S.y)<5) c.mag=true;
      if(c.mag){ const k=Math.min(1,dt*9); c.x+=(S.x-c.x)*k; c.y+=(S.y+1.3-c.y)*k; c.z+=(S.z-0.2-c.z)*k; c.mesh.position.set(c.x,c.y,c.z); }
      if(Math.abs(c.z-S.z)<1.0&&Math.abs(c.x-S.x)<0.9&&c.y>S.y-0.4&&c.y<S.y+top+0.2){ c.taken=true; const gain=P.double>0?2:1; S.coins+=gain; S.score+=10*gain;
        S.chain=(now-S.lastCoin<0.45)?S.chain+1:0; S.lastCoin=now; sndCoin(S.chain); burst(c.x,c.y+0.3,c.z,C_SPARK,8,0.5); } }
    for(const it of items){ if(it.taken) continue; if(Math.abs(it.z-S.z)<1.3&&Math.abs(it.x-S.x)<1.0&&S.y<2.6){ it.taken=true; activate(it.type); } }
    // 生成 / 清除
    while(S.nextRow>S.z-190){ spawnRow(S.nextRow); S.nextRow-=rnd(15,24)+S.speed*0.25; }
    obstacles=obstacles.filter(o=>{ if(o.z>S.z+20||(o.knock&&o.knock.t>1.6)){ scene.remove(o.mesh); return false; } return true; });
    coins=coins.filter(c=>{ if(c.z>S.z+12||(c.taken&&c.t>0.3)){ scene.remove(c.mesh); return false; } return true; });
    items=items.filter(i=>{ if(i.z>S.z+12||(i.taken&&i.t>0.3)){ scene.remove(i.mesh); return false; } return true; });
    // 輪胎塵土
    if(S.grounded&&Math.random()<dt*30) dust.emit(S.x+rnd(-0.1,0.1),S.y+0.08,S.z+0.9,rnd(-0.6,0.6),rnd(0.3,1.0),rnd(1,3),rnd(0.5,0.9),rnd(0.35,0.7),C_DUST,0.35,0.5);
    if(P.rocket>0) for(let i=0;i<3;i++) for(const s of [1,-1]) sparks.emit(S.x+s*0.42,S.y+0.9,S.z+0.9,rnd(-0.5,0.5),rnd(-3,-1),rnd(3,6),rnd(0.2,0.45),rnd(0.3,0.6),C_FLAME,0.9,0);
    ui.score.textContent=Math.floor(S.score); ui.coins.textContent=S.coins; ui.mult.textContent='x'+mult;
    ui.warn.hidden=!(S.chaseTimer>0&&S.t>3); updatePowersUI();
  } else if(S.state==='dying'){
    S.deadT+=dt; S.speed=Math.max(0,S.speed-dt*40); S.z-=S.speed*dt*0.3; S.y=Math.max(0,S.y-dt*5);
    u.bike.rotation.z=Math.max(-1.25,u.bike.rotation.z-dt*2.5);
    if(S.deadT>2.3) endGame();
  }
  // 被鐵頭盔撞飛的障礙
  for(const o of obstacles){ if(!o.knock) continue; const k=o.knock; k.t+=dt; k.vy-=25*dt; o.mesh.position.x+=k.vx*dt; o.mesh.position.y+=k.vy*dt; o.mesh.position.z+=k.vz*dt; o.mesh.rotation.x+=k.rx*dt; o.mesh.rotation.z+=k.rz*dt; }
  for(const o of obstacles){ if(o.type==='line'&&Math.abs(o.z-S.z)<60) o.mesh.userData.clothes.forEach((c,i)=>{ c.rotation.x=Math.sin(now*3+i*1.3+o.z)*0.18+(Math.abs(o.z-S.z)<3&&S.state==='play'?0.5:0); }); }
  // 牛來
  const near=S.state==='title'?3.2:(S.state==='dying'||S.state==='over')?1.6:(S.power.rocket>0?40:(S.chaseTimer>0?2.6:17));
  S.chaseDist+=(near-S.chaseDist)*Math.min(1,dt*(S.state==='dying'?2.5:1.6));
  const side=S.state==='title'?1.6:(S.state==='dying'||S.state==='over'?0.9:(S.lane===2?-1.3:1.3));
  chaser.position.set(chaser.position.x+((S.x+side)-chaser.position.x)*Math.min(1,dt*5),0,S.z+S.chaseDist);
  animChaser(chaser,dt,S.speed,S.state==='title'?'idle':((S.state==='dying'&&S.deadT>0.7)||S.state==='over'?'grab':'run'));
  // 玩家外觀
  player.position.set(S.x,S.y,S.z);
  const mv=S.state==='play'?S.speed:(S.state==='dying'?S.speed*0.3:0);
  for(const w of u.wheels){ w.rotation.x-=mv*dt/0.47; w.userData.glow.visible=P.spring>0; }
  u.crankA+=mv*dt/0.47*0.55*(P.rocket>0?0.3:1);
  u.rockets.visible=P.rocket>0; u.flames.forEach(f=>f.scale.set(0.12,0.5+Math.random()*0.4,0.12));
  u.rider.userData.helmet.visible=P.shield>0; u.rider.userData.magnet.visible=P.magnet>0;
  if(P.magnet>0) u.rider.userData.magnet.rotation.y=now*3;
  if(S.state==='play'){
    const wob=S.wobble>0?Math.sin(S.wobble*30)*0.18*S.wobble:0;
    u.bike.rotation.z+=((S.lean*0.9+wob)-u.bike.rotation.z)*Math.min(1,dt*12);
    const pitch=P.rocket>0?-0.12:(S.grounded?0:clamp(S.vy*0.022,-0.25,0.25));
    u.bike.rotation.x+=(pitch-u.bike.rotation.x)*Math.min(1,dt*10);
  }
  player.visible=!(S.invuln>0 && Math.floor(now*14)%2===0);
  const ducking=S.duck>0;
  u.rider.scale.x+=(0.82-u.rider.scale.x)*Math.min(1,dt*14); u.rider.scale.z=u.rider.scale.x;
  u.rider.scale.y+=((ducking?0.57:0.82)-u.rider.scale.y)*Math.min(1,dt*14);
  u.rider.rotation.x+=((ducking?-0.35:(S.state==='title'?0:-0.08))-u.rider.rotation.x)*Math.min(1,dt*12);
  u.rider.position.y=u.riderBase.y+(S.state==='play'&&S.grounded?Math.abs(Math.sin(u.crankA*2))*0.025:0);
  poseRider(player);
  pShadow.position.set(S.x,0.03,S.z); const sh=clamp(1-S.y/6,0.15,1); pShadow.material.opacity=0.28*sh; pShadow.scale.set(0.7*sh+0.2,1.4*sh+0.3,1);
  // 奶蛋 / 道具動畫
  for(const c of coins){ if(c.taken){ c.t+=dt; c.mesh.position.y+=dt*6; c.mesh.scale.setScalar(1.05*(1-c.t*3)); }
    else if(!c.mag){ c.mesh.rotation.y=Math.PI+Math.sin(now*3+c.z)*0.8; c.mesh.position.y=c.y+Math.sin(now*4+c.z)*0.08; } }
  for(const it of items){ const inn=it.mesh.userData.inner; if(it.taken){ it.t+=dt; it.mesh.scale.setScalar(1+it.t*4); } inn.rotation.y=now*2; inn.position.y=1.1+Math.sin(now*3)*0.15; }
  // 地塊循環
  for(const t of tiles){ if(t.position.z>S.z+TILE*1.6){ t.position.z-=NT*TILE; buildProps(t); } }
  far.position.set(S.x*0.2,0,S.z);
  for(const c of clouds){ c.position.x+=dt*1.5; if(c.position.x>460) c.position.x=-460; }
  for(const fl of far.children){ if(fl.userData.v){ fl.position.x+=fl.userData.v*dt; if(Math.abs(fl.position.x)>260) fl.userData.v*=-1, fl.rotation.y=fl.userData.v>0?0:Math.PI; } }
  for(const b of birds){ const a=Math.sin(now*8+b.userData.ph)*0.6; b.userData.l.rotation.z=a; b.userData.r.rotation.z=-a; }
  // 晝夜
  const tod=S.todBase+S.dist/2800; applyTOD(tod); ui.tod.textContent=TOD.name;
  skyU.uTime.value=now; windU.value=now;
  envTimer-=dt; if(envTimer<=0 && Math.abs(tod-lastEnvTod)>0.004){ updateEnv(); lastEnvTod=tod; envTimer=cfg.hq?0.8:2.5; }
  // 螢火蟲
  const nf=TOD.night; fireflies.visible=nf>0.05;
  if(fireflies.visible){ for(let i=0;i<FF_N;i++){ let z=ffPos[i*3+2]; if(z>S.z+10) z-=75; if(z<S.z-65) z+=75; ffPos[i*3+2]=z;
      ffPos[i*3]+=Math.sin(now*0.7+ffPh[i])*dt*0.6; ffPos[i*3+1]=clamp(ffPos[i*3+1]+Math.cos(now*0.9+ffPh[i]*2)*dt*0.4,0.3,3.5);
      if(Math.abs(ffPos[i*3])<5) ffPos[i*3]+=(ffPos[i*3]<0?-1:1)*dt*2;
      const b=0.5+0.5*Math.sin(now*3+ffPh[i]*5); ffCol.set([C_FF.r,C_FF.g,C_FF.b,nf*b],i*4); }
    ffGeo.attributes.position.needsUpdate=true; ffGeo.attributes.pcol.needsUpdate=true; }
  dust.update(dt); sparks.update(dt);
  // 光影跟隨
  const lp=_a.copy(sunDir).multiplyScalar(40); if(lp.y<8) lp.y=8;
  sun.position.set(S.x+lp.x,lp.y,S.z+lp.z); sun.target.position.set(S.x,0,S.z-4);
  sky.position.copy(camera.position);
  // 鏡頭
  let cp,cl;
  if(S.state==='title'){ const a=now*0.25; cp=_m.set(S.x+Math.sin(a)*1.2+2.6,2.2,S.z-6.2); cl=_k.set(S.x+(camera.aspect>1.1?-2.4:0.6),1.5,S.z+1.8); }
  else if(S.state==='over'||(S.state==='dying'&&S.deadT>0.4)){ cp=_m.set(S.x-5.6,2.6,S.z-1.6); cl=_k.set(S.x+0.3,-0.4,S.z+0.9); }
  else { cp=_m.set(S.x*0.6,5.0+S.y*0.6,S.z+8.4); cl=_k.set(S.x*0.35,1.4+S.y*0.8,S.z-9); }
  const k=Math.min(1,dt*(S.state==='play'?8:2.5));
  cam.pos.lerp(cp,k); cam.look.lerp(cl,k);
  camera.position.copy(cam.pos);
  if(S.shake>0){ S.shake-=dt; camera.position.x+=rnd(-1,1)*S.shake*0.5; camera.position.y+=rnd(-1,1)*S.shake*0.5; }
  camera.lookAt(cam.look);
  const fovT=(camera.aspect<0.8?76:62)+(S.state==='play'?(S.speed-15)*0.35+(P.rocket>0?8:0):0);
  camera.fov+=(fovT-camera.fov)*Math.min(1,dt*3); camera.updateProjectionMatrix();
}

/* =========================================================
   LOOP
   ========================================================= */
function resize(){ const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  const sc=h*renderer.getPixelRatio()*0.5; dust.mat.uniforms.scale.value=sparks.mat.uniforms.scale.value=fireflies.material.uniforms.scale.value=sc; }
window.addEventListener('resize',resize);
applyQuality();
chaser.position.set(1.6,0,3);
applyTOD(S.todBase); updateEnv();
const clock=new THREE.Clock(); let simNow=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);
  if(!S.paused){ simNow+=dt; update(dt,simNow); }
  renderer.render(scene,camera);
}
frame();

})();
